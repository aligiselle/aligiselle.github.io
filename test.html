<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    
</head>

<body style='margin : 0px; overflow: hidden;'>
  <!-- we add detectionMode and matrixCodeType to tell AR.js to recognize barcode markers -->
<a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; patternRatio:0.80;' xr-mode-ui="enabled: false">

<a-assets>
    <video id="launch" autoplay loop src="assets/vid1.mp4"></video>
    <img id="arrow">
    <img id="texture" src="assets/titl-logo-website.png">
</a-assets>
    
    <a-image
        src="#arrow"
        width="0.07"
        height="0.07"
        position="0.125 0 -0.85"
        rotation="0 0 0"
        >
    </a-image>
    <a-image
        id="tap"
        width=".1"
        height=".1"
        position="0.135 0.09 -0.85"
        rotation="0 0 0"
        src="/assets/TAP.png">
    </a-image>
    <a-video
         src="#launch"
         width="0.09"
         height="0.16"
         position="0 0 -0.4"
         rotation="0 0 0"
    >
    </a-video>
    <!-- Basic box. -->

    <!-- Textured box. -->
     <a-box 
      src="#texture"
      position = "-0.125 0.075 -0.775"
      width="0.05"
      height="0.05"
      depth="0.05"
      animation="property: rotation; to: -360 0 0; loop: true; dur: 15000; easing: linear;"
      animation__2="property: position; to: -0.125 -0.075 -0.875; loop: true; dur: 10000; dir: alternate; easing: linear;"
      >
    </a-box>
    <a-entity><a-image src="#arrow" position="0 0 0"></a-image></a-entity>
 <a-marker type="pattern" preset="custom" url="assets/titl-pattern-frame.patt" emitevents="true"> 
</a-marker>

<!-- use this <a-entity camera> to support multiple-markers, otherwise use <a-marker-camera> instead of </a-marker> -->
<a-entity camera cursor="fuse: false; rayOrigin: mouse;" position="0 0 0"></a-entity>
</a-scene> 
<script src="app.js"></script>
</body>
</html>
