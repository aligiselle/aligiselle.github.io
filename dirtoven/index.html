<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>I Love Tobago — AR</title>
<link rel="stylesheet" href="styles.css">

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.168.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.168.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="intro">
  <h1>I Love Tobago<br>in your space</h1>
  <p>Aim at the floor to position it, drag to turn it, pinch to size it, then tap to place.</p>
  <div id="ar-button-slot"></div>
  <div id="gallery" hidden>
    <p class="hint">Tap a photo to save it to your device.</p>
    <div id="shots"></div>
  </div>
  <p id="unsupported" hidden>This device or browser can't run WebXR AR. Try Chrome on Android or the Meta Quest Browser, over HTTPS.</p>
</div>

<div id="overlay" class="hidden">
  <div id="gesture"></div>
  <div id="status">Loading model…</div>
  <div id="countdown"></div>
  <div id="flash"></div>

  <div id="panel">
    <div id="readout">35 cm · facing you</div>

    <!-- placing mode -->
    <div class="row" id="row-adjust">
      <button class="chip" id="rot-left" aria-label="Turn left">↺</button>
      <button class="chip" id="smaller" aria-label="Smaller">−</button>
      <button class="chip primary" id="place">Place</button>
      <button class="chip" id="bigger" aria-label="Bigger">+</button>
      <button class="chip" id="rot-right" aria-label="Turn right">↻</button>
    </div>
    <div class="row" id="row-adjust-2">
      <button class="chip" id="reset">Reset size</button>
    </div>

    <!-- placed mode -->
    <div class="row" id="row-photo" hidden>
      <button class="chip" id="timer">Timer: off</button>
      <button class="chip primary" id="photo">Take photo</button>
    </div>
    <!-- placed mode: video -->
    <div class="row" id="row-video" hidden>
      <button class="chip" id="record">&#9679; Record</button>
      <button class="chip" id="hideui">Hide UI</button>
    </div>
    <div class="row" id="row-placed" hidden>
      <button class="chip" id="reposition">Move it</button>
      <button class="chip" id="another">Add another</button>
      <button class="chip" id="clear">Clear all</button>
    </div>
  </div>

  <div id="review">
    <img id="shot" alt="Your AR photo">
    <div class="row">
      <button class="chip primary" id="share" hidden>Share</button>
      <button class="chip" id="save">Save (exits AR)</button>
      <button class="chip" id="retake">Back to AR</button>
    </div>
  </div>
</div>

<div id="errors" hidden></div>
<div id="cleanhint"></div>

<script type="module" src="app.js"></script>
</body>
</html>
