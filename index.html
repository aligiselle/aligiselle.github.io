<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TITL RE-LAUNCH</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
</head>

<body style='margin : 0px; overflow: hidden;'>
  <!-- we add detectionMode and matrixCodeType to tell AR.js to recognize barcode markers -->
<a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; patternRatio:0.80;' xr-mode-ui="enabled: false">

<a-assets>
    <video id="launch" autoplay loop controls src="assets/VID-20250716-WA0014.mp4"></video>
</a-assets>
    
<a-marker type="pattern" preset="custom" url="assets/titl-pattern-frame.patt" emitevents="true">
    <a-video
         src="#launch"
         width="1.6"
         height="0.9"
         position="0 0 0"
         rotation="-90 0 0"
    >
    </a-video>
    <!--
    <a-image
        id="ar-image"
        width="1"
        height="1"
        position="1.5 0 0"
        rotation="-90 0 0"
        src="assets/HappyBirthday2.png"
        link="href: https://yahoo.com"
        >
    </a-image>
    -->
</a-marker>

<!-- use this <a-entity camera> to support multiple-markers, otherwise use <a-marker-camera> instead of </a-marker> -->
<a-entity camera cursor="fuse: false; rayOrigin: mouse;"></a-entity>
</a-scene>
<script>
/** window.addEventListener("click", ()=>{
    const video = document.getElementById("searching")
    video.play()
  }) */
</script>
</body>
</html>
